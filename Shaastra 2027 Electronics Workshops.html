<html lang="en"><head><meta charset="utf-8">

<title>Shaastra 2027 Electronics Workshops</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f6;--card:#fff;--tx:#0d2230;--mute:#4d6675;--acc:#0a8fa0;--accfg:#fff;--bd:#cfdde3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1c28;--card:#12303f;--tx:#e8f6f8;--mute:#8fb3c0;--acc:#2de3e6;--accfg:#062029;--bd:#1f4757}}
:root[data-theme="dark"]{--bg:#0b1c28;--card:#12303f;--tx:#e8f6f8;--mute:#8fb3c0;--acc:#2de3e6;--accfg:#062029;--bd:#1f4757}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
header h1{font-size:clamp(14px,3.5vw,18px);margin:0;letter-spacing:.02em}
header span{color:var(--mute);font-weight:400}
button,.btn{font:inherit;cursor:pointer}
.tog{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;gap:8px;position:relative}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.arrow:disabled{opacity:.3;cursor:default}
.slide{flex:1;max-width:980px;min-width:0;max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.slide img{width:100%;height:auto;border-radius:10px;display:block}
.meta{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 4px 4px}
.meta h2{margin:0 0 4px;font-size:clamp(18px,4.5vw,26px)}
.meta p{margin:0;color:var(--mute);font-size:14px}
.btn{background:var(--acc);color:var(--accfg);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:8px;padding:12px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--bd);padding:0}
.dots button.on{background:var(--acc);width:26px;border-radius:6px}
.grid{display:none;flex:1;overflow-y:auto;padding:8px 16px 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;border-radius:8px;display:block}
.card h3{margin:0;font-size:15px}.card p{margin:0;color:var(--mute);font-size:13px}
.card .btn{text-align:center;padding:10px}
body.ov main,body.ov .dots{display:none}body.ov .grid{display:grid}
@media (max-width:600px){.arrow{display:none}}
</style></head><body>

function show(n){i=Math.max(0,Math.min(D.length-1,n));const d=D[i];
$("slide").style.animation="none";void $("slide").offsetWidth;$("slide").style.animation="";
$("slide").innerHTML=`<img src="${d.img}" alt="${d.t}"><div class="meta"><div><h2>${d.t}</h2><p>${d.d} · IIT Madras</p><p>Contact: ${d.c}</p></div>${link(d,"Register ↗")}</div>`;
$("prev").disabled=i==0;$("next").disabled=i==D.length-1;
$("dots").innerHTML=D.map((_,k)=>`<button class="${k==i?"on":""}" data-k="${k}" aria-label="Slide ${k+1}"></button>`).join("")}
$("dots").onclick=e=>{if(e.target.dataset.k)show(+e.target.dataset.k)};
$("prev").onclick=()=>show(i-1);$("next").onclick=()=>show(i+1);
$("grid").innerHTML=D.map((d,k)=>`<div class="card"><img src="${d.img}" alt="${d.t}"><h3>${d.t}</h3><p>${d.d} · ${d.c}</p>${link(d,"Register ↗")}</div>`).join("");
$("tog").onclick=()=>{document.body.classList.toggle("ov");$("tog").textContent=document.body.classList.contains("ov")?"Slides":"Overview"};
document.onkeydown=e=>{if(e.key=="ArrowRight")show(i+1);if(e.key=="ArrowLeft")show(i-1)};
let x0=null;const m=document.querySelector("main");
m.ontouchstart=e=>x0=e.touches[0].clientX;
m.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));x0=null};
show(0);
</script></body></html>
